server {
    listen 80;
    server_name web1.domaincuaban.id.vn localhost;

    location / {
        root /usr/share/nginx/website1;
        index index.html;
    }

    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name web2.domaincuaban.id.vn;

    location / {
        root /usr/share/nginx/website2;
        index index.html;
    }
}
